<!DOCTYPE html>
<html lang="fr" class="mobile">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Rien ne peut être chargé ni envoyé ailleurs que depuis l'application
       elle-même : si du code étranger arrivait à s'exécuter, il n'aurait
       aucun moyen de sortir les données. connect-src autorise le seul site
       d'Immigration Voyages, pour la synchronisation. La question « y a-t-il
       une nouvelle version ? » part du processus principal (mise-a-jour.js),
       jamais de cette page. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://uhfjegbrodjlcmgjicfo.supabase.co; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
  <title>IV Devis</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icone-192.png" />
  <link rel="apple-touch-icon" href="assets/icone-apple-180.png" />
  <meta name="theme-color" content="#0C2E52" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="IV Devis" />
</head>
<body>
  <div id="titlebar">
    <span class="tb-title">IV Devis — Immigration Voyages</span>
    <div class="tb-btns">
      <button id="tb-min" title="Réduire" aria-label="Réduire">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><line x1="1" y1="6" x2="11" y2="6"/></svg>
      </button>
      <button id="tb-max" title="Agrandir" aria-label="Agrandir">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="1.5" width="9" height="9" rx="1"/></svg>
      </button>
      <button id="tb-close" title="Fermer" aria-label="Fermer">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg>
      </button>
    </div>
  </div>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">

          <div class="brand-tagline">Immigration Voyages</div>
        </div>
      </div>
      <nav>
        <button class="nav-btn" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Tableau de bord
        </button>
        <button class="nav-btn" data-view="devis">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>

        <button class="nav-btn" data-view="factures">

      <div class="sidebar-footer">Données sur cet appareil</div>
    </aside>
    <main id="main"></main>
  </div>
  <div id="sendbar"></div>
  <div id="toast"></div>
  <script src="paquet.js"></script>
  <script src="reglages-agence.js"></script>
  <script src="pdf-mobile.js"></script>
  <script src="mobile.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
